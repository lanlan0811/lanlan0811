<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="兰 - 静立巅峰，眺望心之狂野">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170A2B"/>
      <stop offset="42%" stop-color="#43155C"/>
      <stop offset="74%" stop-color="#9B2A79"/>
      <stop offset="100%" stop-color="#E94E8A"/>
    </linearGradient>

    <radialGradient id="aura" cx="50%" cy="0%" r="72%">
      <stop offset="0%" stop-color="#FF7AB8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#E94E8A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E94E8A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sideGlow" cx="0%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8FC4" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#C77DFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF8FC4" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFD1E8" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <ellipse cx="600" cy="-30" rx="540" ry="210" fill="url(#aura)"/>
  <ellipse cx="40" cy="300" rx="380" ry="220" fill="url(#sideGlow)"/>

  <!-- 星点 -->
  <g fill="#FFE3F1">
    <circle cx="142" cy="74" r="2.2" opacity="0.85"/>
    <circle cx="236" cy="42" r="1.4" opacity="0.55"/>
    <circle cx="318" cy="108" r="1.8" opacity="0.45"/>
    <circle cx="905" cy="62" r="2.0" opacity="0.75"/>
    <circle cx="1002" cy="112" r="1.4" opacity="0.5"/>
    <circle cx="1082" cy="52" r="2.4" opacity="0.6"/>
    <circle cx="760" cy="38" r="1.3" opacity="0.5"/>
    <circle cx="452" cy="58" r="1.5" opacity="0.4"/>
  </g>

  <!-- 波浪层 -->
  <path d="M0,230 C140,205 250,252 380,240 C520,227 610,196 750,214 C880,231 1040,252 1200,228 L1200,280 L0,280 Z" fill="url(#wave1)"/>
  <path d="M0,250 C170,232 300,262 460,250 C620,238 720,214 880,236 C1010,254 1100,262 1200,246 L1200,280 L0,280 Z" fill="url(#wave2)"/>

  <!-- 主标题 -->
  <text x="600" y="132" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="86" font-weight="700" fill="#FFFFFF" filter="url(#glow)">兰</text>

  <!-- 分隔线 -->
  <rect x="470" y="154" width="260" height="1" fill="url(#rule)"/>

  <!-- 副标题 -->
  <text x="600" y="193" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="19" letter-spacing="6" fill="#FFE3F1" filter="url(#softglow)">静立巅峰，眺望心之狂野</text>

  <!-- 社交图标 -->
  <g transform="translate(377, 0)" stroke="#FFFFFF" stroke-opacity="0.85" fill="none"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <g font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#FFE3F1"
       fill-opacity="0.9" stroke="none">
      <!-- 网站 -->
      <g transform="translate(0, 232)">
        <circle cx="0" cy="-4" r="6.5" stroke="#FFFFFF" stroke-opacity="0.85" fill="none"/>
        <ellipse cx="0" cy="-4" rx="2.8" ry="6.5" stroke="#FFFFFF" stroke-opacity="0.85" fill="none"/>
        <path d="M-6.5,-4 H6.5" stroke="#FFFFFF" stroke-opacity="0.85"/>
        <text x="14" y="0">lanaiw.top</text>
      </g>

      <!-- Bilibili -->
      <g transform="translate(118, 232)">
        <rect x="0" y="-8" width="15" height="11" rx="2.5" stroke="#FFFFFF" stroke-opacity="0.85" fill="none"/>
        <path d="M3,-12 L5.5,-9 M12,-12 L9.5,-9" stroke="#FFFFFF" stroke-opacity="0.85"/>
        <path d="M4.5,-4.5 V-1 M10.5,-4.5 V-1" stroke="#FFFFFF" stroke-opacity="0.85"/>
        <text x="23" y="0">Bilibili</text>
      </g>

      <!-- X -->
      <g transform="translate(212, 232)">
        <path d="M0,-10 L11,0 M11,-10 L0,0" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.6"/>
        <text x="19" y="0">@Lanmbsn</text>
      </g>

      <!-- Email -->
      <g transform="translate(310, 232)">
        <rect x="0" y="-8.5" width="16" height="11" rx="1.8" stroke="#FFFFFF" stroke-opacity="0.85" fill="none"/>
        <path d="M0.6,-8 L8,-2.6 L15.4,-8" stroke="#FFFFFF" stroke-opacity="0.85" fill="none"/>
        <text x="24" y="0">lanaiw2025@163.com</text>
      </g>
    </g>
  </g>
</svg>
