<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="兰 - 静立巅峰，眺望心之狂野">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040C1C"/>
      <stop offset="35%" stop-color="#0A1F3D"/>
      <stop offset="68%" stop-color="#123E77"/>
      <stop offset="100%" stop-color="#1C5FA8"/>
    </linearGradient>

    <radialGradient id="auraTop" cx="22%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#6FD6FF" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#2E86DE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2E86DE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraAvatar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A8ECFF" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#4FB8F0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#4FB8F0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraBottom" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#3A8FDB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3A8FDB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FE3FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#BFF0FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8FE3FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFF0FF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#4FB8F0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#BFF0FF" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="feather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9FE4FF" stop-opacity="0.20"/>
    </linearGradient>

    <filter id="titleGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="d"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="b"/>
      <feComponentTransfer in="b" result="d">
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="d"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#9FE4FF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="avatarClip">
      <circle cx="920" cy="210" r="118"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#auraTop)"/>
  <rect width="1200" height="420" fill="url(#auraBottom)"/>

  <!-- 斜向光束 -->
  <g opacity="0.16">
    <path d="M-40,420 L250,0 L330,0 L40,420 Z" fill="#9FE4FF" opacity="0.10"/>
    <path d="M120,420 L410,0 L455,0 L165,420 Z" fill="#9FE4FF" opacity="0.07"/>
  </g>

  <!-- 头像光环 -->
  <circle cx="920" cy="210" r="205" fill="url(#auraAvatar)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 920 210" to="360 920 210" dur="42s" repeatCount="indefinite"/>
    <circle cx="920" cy="210" r="152" fill="none" stroke="url(#ring)" stroke-width="1.2" stroke-dasharray="3 9" opacity="0.75"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 920 210" to="0 920 210" dur="68s" repeatCount="indefinite"/>
    <circle cx="920" cy="210" r="168" fill="none" stroke="url(#ring)" stroke-width="0.8" opacity="0.35"/>
  </g>
  <circle cx="920" cy="210" r="132" fill="none" stroke="#BFF0FF" stroke-width="1.6" opacity="0.55">
    <animate attributeName="opacity" values="0.55;0.28;0.55" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- 头像 -->
  <image x="802" y="92" width="236" height="236" href="data:image/png;base64,__AVATAR_B64__" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- 羽毛（动态漂浮） -->
  <g fill="url(#feather)">
    <g>
      <animate attributeName="opacity" values="0.6;0.95;0.6" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="120,84; 138,50; 152,88; 130,120; 120,84"
        keyTimes="0;0.28;0.52;0.78;1" dur="14s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-24;-6;-30;-12;-24" keyTimes="0;0.3;0.55;0.8;1" dur="9s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
        <g transform="scale(0.9)">
          <path d="M0,0 C10,-22 30,-34 52,-30 C40,-12 20,3 0,0 Z"/>
          <path d="M2,-1 C18,-9 34,-19 48,-27" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" fill="none"/>
        </g>
      </g>
    </g>

    <g>
      <animate attributeName="opacity" values="0.45;0.85;0.45" dur="11s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="258,300; 276,268; 292,304; 268,338; 258,300"
        keyTimes="0;0.26;0.5;0.76;1" dur="17s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="18;34;8;26;18" keyTimes="0;0.32;0.58;0.82;1" dur="12s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
        <g transform="scale(0.62)">
          <path d="M0,0 C10,-22 30,-34 52,-30 C40,-12 20,3 0,0 Z"/>
          <path d="M2,-1 C18,-9 34,-19 48,-27" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" fill="none"/>
        </g>
      </g>
    </g>

    <g>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="9.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="690,72; 706,44; 722,78; 700,106; 690,72"
        keyTimes="0;0.3;0.54;0.8;1" dur="15.5s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="32;16;44;24;32" keyTimes="0;0.28;0.56;0.8;1" dur="10.5s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
        <g transform="scale(0.5)">
          <path d="M0,0 C10,-22 30,-34 52,-30 C40,-12 20,3 0,0 Z"/>
          <path d="M2,-1 C18,-9 34,-19 48,-27" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" fill="none"/>
        </g>
      </g>
    </g>

    <g>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="12.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="1080,330; 1060,296; 1042,332; 1066,364; 1080,330"
        keyTimes="0;0.3;0.55;0.8;1" dur="18s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-14;-30;-4;-22;-14" keyTimes="0;0.3;0.56;0.8;1" dur="13.5s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
        <g transform="scale(0.75)">
          <path d="M0,0 C10,-22 30,-34 52,-30 C40,-12 20,3 0,0 Z"/>
          <path d="M2,-1 C18,-9 34,-19 48,-27" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" fill="none"/>
        </g>
      </g>
    </g>

    <g>
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="600,352; 618,324; 634,356; 612,382; 600,352"
        keyTimes="0;0.28;0.52;0.78;1" dur="16s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="8;24;0;16;8" keyTimes="0;0.3;0.56;0.8;1" dur="11.5s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
        <g transform="scale(0.42)">
          <path d="M0,0 C10,-22 30,-34 52,-30 C40,-12 20,3 0,0 Z"/>
        </g>
      </g>
    </g>

    <g>
      <animate attributeName="opacity" values="0.3;0.65;0.3" dur="13.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate"
        values="420,120; 438,92; 456,124; 432,150; 420,120"
        keyTimes="0;0.3;0.54;0.8;1" dur="19s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-38;-52;-26;-44;-38" keyTimes="0;0.3;0.56;0.8;1" dur="14s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
        <g transform="scale(0.36)">
          <path d="M0,0 C10,-22 30,-34 52,-30 C40,-12 20,3 0,0 Z"/>
        </g>
      </g>
    </g>
  </g>

  <!-- 星点 / 冰晶（闪烁） -->
  <g fill="#DFF7FF">
    <circle cx="96" cy="196" r="2.1"><animate attributeName="opacity" values="0.85;0.25;0.85" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="172" cy="330" r="1.5"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="66" r="1.7"><animate attributeName="opacity" values="0.6;0.18;0.6" dur="6.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="40" r="1.4"><animate attributeName="opacity" values="0.45;0.12;0.45" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="742" cy="330" r="1.8"><animate attributeName="opacity" values="0.5;0.14;0.5" dur="6.8s" repeatCount="indefinite"/></circle>
    <circle cx="1128" cy="88" r="2.0"><animate attributeName="opacity" values="0.65;0.2;0.65" dur="5.8s" repeatCount="indefinite"/></circle>
    <circle cx="1058" cy="384" r="1.4"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="7.6s" repeatCount="indefinite"/></circle>
    <circle cx="378" cy="228" r="1.3"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="9s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#DFF7FF" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round">
    <path d="M1132,150 v10 M1127,155 h10"><animate attributeName="stroke-opacity" values="0.55;0.12;0.55" dur="6s" repeatCount="indefinite"/></path>
    <path d="M212,262 v8 M208,266 h8"><animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="7.4s" repeatCount="indefinite"/></path>
    <path d="M700,166 v7 M696.5,169.5 h7"><animate attributeName="stroke-opacity" values="0.45;0.1;0.45" dur="8.4s" repeatCount="indefinite"/></path>
  </g>

  <!-- 标题 -->
  <text x="392" y="196" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="120" font-weight="700" fill="#FFFFFF" filter="url(#titleGlow)">兰</text>

  <!-- LAN -->
  <text x="392" y="240" text-anchor="middle"
        font-family="'JetBrains Mono','Consolas',monospace"
        font-size="15" letter-spacing="12" fill="#9FE4FF" fill-opacity="0.85">L A N</text>

  <!-- 分隔线 -->
  <rect x="252" y="266" width="280" height="1" fill="url(#rule)"/>

  <!-- 副标题 -->
  <text x="392" y="308" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="22" letter-spacing="7" fill="#E8F6FF" filter="url(#softGlow)">静立巅峰，眺望心之狂野</text>

  <!-- 英文副标 -->
  <text x="392" y="342" text-anchor="middle"
        font-family="'JetBrains Mono','Consolas',monospace"
        font-size="11" letter-spacing="3.5" fill="#8FD3F4" fill-opacity="0.75">AI AGENT ORCHESTRATION · AI FILM · VISUAL WORKBENCH</text>

  <!-- 底部细线 -->
  <rect x="0" y="418" width="1200" height="2" fill="url(#rule)" opacity="0.5"/>
</svg>
