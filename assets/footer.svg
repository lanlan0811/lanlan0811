<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="静立巅峰，眺望心之狂野">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E94E8A"/>
      <stop offset="30%" stop-color="#9B2A79"/>
      <stop offset="62%" stop-color="#43155C"/>
      <stop offset="100%" stop-color="#170A2B"/>
    </linearGradient>

    <linearGradient id="fw1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8FC4" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#C77DFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FF8FC4" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="fw2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFD1E8" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="frule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="fsoftglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="fgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="140" fill="url(#fbg)"/>
  <rect width="1200" height="140" fill="url(#fgrid)"/>

  <!-- 波浪层 -->
  <path d="M0,96 C160,78 300,112 470,100 C640,88 760,66 930,86 C1050,100 1130,106 1200,92 L1200,140 L0,140 Z" fill="url(#fw1)"/>
  <path d="M0,116 C190,102 340,126 520,116 C700,106 820,90 990,108 C1090,119 1150,122 1200,112 L1200,140 L0,140 Z" fill="url(#fw2)"/>

  <!-- 分隔线 -->
  <rect x="450" y="46" width="300" height="1" fill="url(#frule)"/>

  <text x="600" y="82" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="24" font-weight="600" letter-spacing="4" fill="#FFFFFF" filter="url(#fsoftglow)">静立巅峰，眺望心之狂野</text>

  <text x="600" y="112" text-anchor="middle"
        font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif"
        font-size="12.5" letter-spacing="2" fill="#FFD1E8" fill-opacity="0.85">如果某个项目对你有帮助，欢迎 Star / Issue / PR</text>
</svg>
